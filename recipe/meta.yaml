{% set name = "json-c" %}
{% set version = "0.18" %}

package:
  name: {{ name|lower }}
  version: "{{ version.split('-')[0] }}"

source:
  url: https://s3.amazonaws.com/json-c_releases/releases/json-c-{{ version }}.tar.gz
  sha256: 876ab046479166b869afc6896d288183bbc0e5843f141200c677b3e8dfb11724
  patches:
    - windows-test-shell.patch  # [win]
    - windows-file-test.patch  # [win]

build:
  number: 1
  run_exports:
    - {{ pin_subpackage(name, max_pin='x.x') }}

requirements:
  build:
    - gnuconfig  # [unix]
    - {{ compiler('c') }}
    - {{ stdlib('c') }}
    - cmake
    - ninja
    - make  # [unix]

test:
  files:
    - probe-consumer
  requires:
    - cmake
    - ninja
    - {{ compiler("c") }}
    - pkg-config
  commands:
    - cmake -S probe-consumer -B probe-build -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_PREFIX_PATH="%LIBRARY_PREFIX%"  # [win]
    - cmake --build probe-build  # [win]
    - probe-build\consumer.exe  # [win]
    - dumpbin /headers probe-build\consumer.exe | findstr /I /C:"AA64 machine (ARM64)"  # [win and arm64]
    - dumpbin /headers "%LIBRARY_BIN%\json-c.dll" | findstr /I /C:"AA64 machine (ARM64)"  # [win and arm64]
    - test -f ${PREFIX}/lib/libjson-c.a  # [not win]
    - test -f ${PREFIX}/lib/libjson-c${SHLIB_EXT}  # [not win]
    - if not exist %LIBRARY_BIN%/json-c.dll exit 1  # [win]
    - if not exist %LIBRARY_LIB%/json-c.lib exit 1  # [win]
    - test -f $PREFIX/lib/pkgconfig/json-c.pc  # [not win]
    - if not exist %LIBRARY_LIB%\pkgconfig\json-c.pc exit 1  # [win]
    - pkg-config --exists json-c

about:
  home: https://github.com/json-c/json-c/wiki
  license: MIT
  license_file: COPYING
  summary: A JSON implementation in C

extra:
  recipe-maintainers:
    - ocefpaf
    - sodre
    - djsutherland
